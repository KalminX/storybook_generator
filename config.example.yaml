# Storybook generator settings.
#
# The app reads "config.yaml" if it exists, otherwise this file.
# To customise, copy this file to "config.yaml" and edit the copy.
# Secrets (API keys) never go here - they belong in the ".env" file.

provider:
  name: gemini
  # Name of the environment variable that holds the API key.
  api_key_env: GEMINI_API_KEY
  text_model: "gemini-3.8-flash"
  image_model: "gemini-3.1-flash-image"
  request_timeout_seconds: 180

retry:
  # Total attempts per API call, including the first one.
  max_attempts: 5
  # Seconds to wait before the first retry; doubles on each retry up to max_delay.
  initial_delay: 2
  max_delay: 30

paths:
  # Relative paths are resolved from the folder containing this file.
  input_file: "input/stories.txt"
  style_file: "input/style_spec.md"
  output_directory: "output"
  log_directory: "logs"

images:
  # Shape of each illustration, e.g. "1:1", "3:4", "4:3", "16:9".
  aspect_ratio: "1:1"
  # Resolution: "1K", "2K" or "4K" (larger costs more). Leave empty for the model default.
  image_size:
  # Send the book's first N finished illustrations with each new page request so
  # characters and style stay consistent. 0 turns this off. Maximum 4.
  reference_images: 1

pdf:
  # Page size in millimetres (default: 8x8 inch square picture book).
  page_width_mm: 203.2
  page_height_mm: 203.2
  margin_mm: 12
  font_name: "Helvetica"
  title_font_name: "Helvetica-Bold"
  font_size: 16
  title_font_size: 32
  line_spacing: 1.35
  show_page_numbers: true
  # Share of each page (below the picture) reserved for the story text.
  text_area_ratio: 0.3
  # Long text shrinks down to this size to fit.
  min_font_size: 10
  # Show the first illustration on the cover.
  cover_illustration: true
  # Optional custom fonts: path to a .ttf file (overrides font_name / title_font_name).
  font_file:
  title_font_file:
  text_color: "#000000"
  background_color: "#FFFFFF"
  # How pictures are stored inside the PDF: "jpeg" (small file) or "png" (lossless, ~10x larger).
  embed_images_as: "jpeg"
  jpeg_quality: 90

logging:
  # DEBUG, INFO, WARNING or ERROR
  level: "INFO"
